environment:
  n_links_range: [3, 3]
  max_links: 3
  nominal_eval_n_links: 3
  topology_eval_n_links: [3]
  cart_mass_range: [1.5, 2.0]
  link_length_range: [0.55, 1.05]
  link_mass_range: [0.65, 1.45]
  rail_limit: 2.5
  max_force: 20.0
  timestep: 0.001
  frame_skip: 4
  max_episode_steps: 1000
  termination_angle: 1.5708

graph:
  node_feat_dim: 9
  edge_feat_dim: 2

rewards:
  upright_weight: 1.0
  alive_bonus: 0.1
  force_penalty: 0.001
  rail_penalty: 0.01

init:
  angle_noise: 0.04
  vel_noise: 0.008

ppo:
  hidden_dim: 128
  n_layers: 3
  n_heads: 4
  dropout: 0.1
  n_envs: 4
  rollout_steps: 4096
  n_epochs: 5
  mini_batch_size: 256
  gamma: 0.995
  gae_lambda: 0.97
  clip_epsilon: 0.2
  value_coef: 0.5
  entropy_coef: 0.003
  lr: 0.00005
  anneal_lr: false
  max_grad_norm: 0.5
  total_steps: 1800000
  save_interval: 100000
  cgat:
    n_icga_layers: 2
    n_heads: 2
    entropy_coef: 0.003
