environment:
  n_links_range: [3, 3]
  max_links: 3
  nominal_eval_n_links: 3
  topology_eval_n_links: [3]
  cart_mass_range: [0.5, 3.0]
  link_length_range: [0.3, 1.2]
  link_mass_range: [0.1, 2.0]
  parameter_regions:
    - weight: 1.0
      cart_mass_range: [0.5, 3.0]
      link_length_range: [0.3, 1.2]
      link_mass_range: [0.1, 2.0]
    - weight: 4.0
      cart_mass_range: [0.5, 3.0]
      link_length_range: [0.05, 2.1]
      link_mass_range: [2.6, 3.9]
    - weight: 1.0
      cart_mass_range: [0.5, 3.0]
      link_length_range: [0.05, 0.65]
      link_mass_range: [0.05, 0.85]
  rail_limit: 2.5
  max_force: 20.0
  timestep: 0.001
  frame_skip: 4
  max_episode_steps: 1000
  termination_angle: 0.7854

graph:
  node_feat_dim: 9
  edge_feat_dim: 2

rewards:
  upright_weight: 1.0
  alive_bonus: 0.45
  force_penalty: 0.00028
  action_rate_penalty: 0.00006
  rail_penalty: 0.008
  angle_penalty: 0.0012
  angular_velocity_penalty: 0.00004
  cart_velocity_penalty: 0.00008
  failure_penalty: 0.8

init:
  angle_noise: 0.025
  vel_noise: 0.006

validation:
  interval_updates: 2
  n_episodes: 2
  aggregate: p25
  reward_config:
    upright_weight: 1.0
    alive_bonus: 0.1
    force_penalty: 0.001
    rail_penalty: 0.01
  points:
    - [0.05, 2.19]
    - [0.28, 3.04]
    - [0.50, 3.47]
    - [0.73, 3.47]
    - [0.73, 3.90]
    - [0.96, 3.47]
    - [1.19, 2.62]
    - [1.42, 3.90]
    - [1.87, 3.04]
    - [2.10, 3.90]
    - [0.28, 0.05]
    - [0.50, 0.48]
    - [0.73, 0.48]
    - [1.64, 0.05]
    - [2.10, 0.05]
    - [2.10, 1.33]

ppo:
  hidden_dim: 128
  n_layers: 3
  n_heads: 4
  dropout: 0.1
  n_envs: 4
  rollout_steps: 1024
  n_epochs: 4
  mini_batch_size: 256
  gamma: 0.998
  gae_lambda: 0.98
  clip_epsilon: 0.025
  value_coef: 0.55
  entropy_coef: 0.00002
  init_log_std: -2.45
  freeze_log_std: true
  trainable_prefixes:
    - gain_net
    - param_residual_net
    - actor_trunk
    - mean_head
    - critic_trunk
    - value_head
  lr: 0.0000025
  anneal_lr: false
  max_grad_norm: 0.12
  total_steps: 100000
  save_interval: 40000
  cgat:
    n_icga_layers: 2
    n_heads: 2
    entropy_coef: 0.00002
