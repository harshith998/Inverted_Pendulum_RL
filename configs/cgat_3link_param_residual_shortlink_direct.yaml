environment:
  n_links_range: [3, 3]
  max_links: 3
  nominal_eval_n_links: 3
  topology_eval_n_links: [3]
  cart_mass_range: [0.5, 3.0]
  link_length_range: [0.3, 1.2]
  link_mass_range: [0.1, 2.0]
  parameter_regions:
    - weight: 5.0
      cart_mass_range: [0.5, 3.0]
      link_length_range: [0.05, 0.18]
      link_mass_range: [0.05, 3.9]
    - weight: 2.0
      cart_mass_range: [0.5, 3.0]
      link_length_range: [0.18, 0.35]
      link_mass_range: [0.05, 3.9]
    - weight: 1.0
      cart_mass_range: [0.5, 3.0]
      link_length_range: [0.3, 1.2]
      link_mass_range: [0.1, 2.0]
  rail_limit: 2.5
  max_force: 20.0
  timestep: 0.001
  frame_skip: 4
  max_episode_steps: 1000
  termination_angle: 0.7854

graph:
  node_feat_dim: 9
  edge_feat_dim: 2

rewards:
  upright_weight: 1.0
  alive_bonus: 0.22
  force_penalty: 0.0006
  rail_penalty: 0.008
  angle_penalty: 0.0005
  angular_velocity_penalty: 0.00003
  cart_velocity_penalty: 0.00008

init:
  angle_noise: 0.02
  vel_noise: 0.004

validation:
  interval_updates: 2
  n_episodes: 2
  aggregate: p25
  reward_config:
    upright_weight: 1.0
    alive_bonus: 0.1
    force_penalty: 0.001
    rail_penalty: 0.01
  points:
    - [0.05, 0.05]
    - [0.05, 0.5]
    - [0.05, 1.8]
    - [0.05, 3.9]
    - [0.10, 0.5]
    - [0.10, 1.8]
    - [0.15, 0.5]
    - [0.15, 3.9]
    - [0.25, 0.5]
    - [0.25, 3.9]
    - [0.50, 1.8]
    - [1.20, 2.0]

ppo:
  hidden_dim: 128
  n_layers: 3
  n_heads: 4
  dropout: 0.1
  n_envs: 4
  rollout_steps: 1024
  n_epochs: 5
  mini_batch_size: 256
  gamma: 0.995
  gae_lambda: 0.97
  clip_epsilon: 0.08
  value_coef: 0.5
  entropy_coef: 0.0001
  init_log_std: -2.0
  freeze_log_std: false
  trainable_prefixes:
    - gain_net
    - param_residual_net
    - critic_trunk
    - value_head
  lr: 0.00003
  anneal_lr: false
  max_grad_norm: 0.25
  total_steps: 180000
  save_interval: 40000
  cgat:
    n_icga_layers: 2
    n_heads: 2
    entropy_coef: 0.0001
