environment:
  n_links_range: [3, 3]
  max_links: 3
  nominal_eval_n_links: 3
  topology_eval_n_links: [3]
  cart_mass_range: [0.5, 3.0]
  link_length_range: [0.3, 1.2]
  link_mass_range: [0.1, 2.0]
  parameter_regions:
    - weight: 1.0
      cart_mass_range: [0.5, 3.0]
      link_length_range: [0.3, 1.2]
      link_mass_range: [0.1, 2.0]
    - weight: 3.0
      cart_mass_range: [0.5, 3.0]
      link_length_range: [0.05, 0.35]
      link_mass_range: [0.05, 3.9]
    - weight: 2.5
      cart_mass_range: [0.5, 3.0]
      link_length_range: [0.35, 1.2]
      link_mass_range: [1.5, 3.9]
    - weight: 1.0
      cart_mass_range: [0.5, 3.0]
      link_length_range: [1.2, 2.1]
      link_mass_range: [0.05, 3.9]
  rail_limit: 2.5
  max_force: 20.0
  timestep: 0.001
  frame_skip: 4
  max_episode_steps: 1000
  termination_angle: 0.7854

graph:
  node_feat_dim: 9
  edge_feat_dim: 2

rewards:
  upright_weight: 1.0
  alive_bonus: 0.45
  force_penalty: 0.00045
  action_rate_penalty: 0.00012
  rail_penalty: 0.01
  angle_penalty: 0.006
  angular_velocity_penalty: 0.00020
  cart_velocity_penalty: 0.00020

init:
  angle_noise: 0.025
  vel_noise: 0.005

validation:
  interval_updates: 2
  n_episodes: 2
  aggregate: p25
  reward_config:
    upright_weight: 1.0
    alive_bonus: 0.1
    force_penalty: 0.001
    rail_penalty: 0.01
  points:
    - [0.05, 0.05]
    - [0.05, 0.5]
    - [0.05, 1.8]
    - [0.05, 3.9]
    - [0.15, 0.5]
    - [0.15, 3.9]
    - [0.30, 0.3]
    - [0.30, 2.5]
    - [0.50, 2.5]
    - [0.75, 1.8]
    - [0.95, 2.5]
    - [1.20, 2.0]
    - [1.60, 2.8]
    - [2.10, 3.9]

ppo:
  hidden_dim: 128
  n_layers: 3
  n_heads: 4
  dropout: 0.1
  n_envs: 4
  rollout_steps: 1024
  n_epochs: 6
  mini_batch_size: 256
  gamma: 0.997
  gae_lambda: 0.98
  clip_epsilon: 0.06
  value_coef: 0.5
  entropy_coef: 0.00008
  init_log_std: -2.35
  freeze_log_std: true
  trainable_prefixes:
    - action_scale_net
    - gain_net
    - actor_trunk
    - mean_head
    - critic_trunk
    - value_head
  lr: 0.000006
  anneal_lr: false
  max_grad_norm: 0.20
  total_steps: 320000
  save_interval: 40000
  cgat:
    n_icga_layers: 2
    n_heads: 2
    entropy_coef: 0.00008
