environment:
  n_links_range: [3, 3]
  max_links: 3
  nominal_eval_n_links: 3
  topology_eval_n_links: [3]
  cart_mass_range: [0.5, 3.0]
  link_length_range: [0.3, 1.2]
  link_mass_range: [0.1, 2.0]
  parameter_regions:
    - weight: 1.0
      cart_mass_range: [0.5, 3.0]
      link_length_range: [0.3, 1.2]
      link_mass_range: [0.1, 2.0]
    - weight: 1.2
      cart_mass_range: [0.5, 3.0]
      link_length_range: [0.3, 0.7]
      link_mass_range: [1.1, 2.0]
    - weight: 1.2
      cart_mass_range: [0.5, 3.0]
      link_length_range: [0.8, 1.2]
      link_mass_range: [1.1, 2.0]
    - weight: 0.7
      cart_mass_range: [0.5, 3.0]
      link_length_range: [0.3, 0.6]
      link_mass_range: [0.1, 0.7]
  rail_limit: 2.5
  max_force: 20.0
  timestep: 0.001
  frame_skip: 4
  max_episode_steps: 1000
  termination_angle: 0.7854

graph:
  node_feat_dim: 9
  edge_feat_dim: 2

rewards:
  upright_weight: 1.0
  alive_bonus: 0.6
  force_penalty: 0.0005
  rail_penalty: 0.01
  angle_penalty: 0.01
  angular_velocity_penalty: 0.0004
  cart_velocity_penalty: 0.0004

init:
  angle_noise: 0.04
  vel_noise: 0.008

validation:
  interval_updates: 4
  n_episodes: 2
  reward_config:
    upright_weight: 1.0
    alive_bonus: 0.1
    force_penalty: 0.001
    rail_penalty: 0.01
  points:
    - [0.20, 0.3]
    - [0.20, 1.8]
    - [0.35, 0.3]
    - [0.35, 1.8]
    - [0.55, 1.8]
    - [0.75, 1.05]
    - [0.95, 1.8]
    - [1.20, 2.0]
    - [1.50, 2.8]
    - [1.90, 3.4]

ppo:
  hidden_dim: 128
  n_layers: 3
  n_heads: 4
  dropout: 0.1
  n_envs: 4
  rollout_steps: 4096
  n_epochs: 6
  mini_batch_size: 256
  gamma: 0.997
  gae_lambda: 0.98
  clip_epsilon: 0.10
  value_coef: 0.5
  entropy_coef: 0.0002
  lr: 0.000008
  anneal_lr: false
  max_grad_norm: 0.4
  total_steps: 900000
  save_interval: 100000
  cgat:
    n_icga_layers: 2
    n_heads: 2
    entropy_coef: 0.0002
