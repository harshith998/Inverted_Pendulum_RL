environment:
  n_links_range: [3, 3]
  max_links: 3
  nominal_eval_n_links: 3
  topology_eval_n_links: [3]
  cart_mass_range: [0.5, 3.0]
  link_length_range: [0.3, 1.2]
  link_mass_range: [0.1, 2.0]
  parameter_regions:
    - weight: 1.0
      cart_mass_range: [0.5, 3.0]
      link_length_range: [0.3, 1.2]
      link_mass_range: [0.1, 2.0]
    - weight: 5.0
      cart_mass_range: [0.5, 3.0]
      link_length_range: [0.05, 0.85]
      link_mass_range: [0.05, 0.55]
    - weight: 2.0
      cart_mass_range: [0.5, 3.0]
      link_length_range: [0.05, 0.35]
      link_mass_range: [0.55, 3.9]
    - weight: 1.5
      cart_mass_range: [0.5, 3.0]
      link_length_range: [1.2, 2.1]
      link_mass_range: [0.05, 1.0]
  rail_limit: 2.5
  max_force: 20.0
  timestep: 0.001
  frame_skip: 4
  max_episode_steps: 1000
  termination_angle: 0.7854

graph:
  node_feat_dim: 9
  edge_feat_dim: 2

rewards:
  upright_weight: 1.0
  alive_bonus: 0.55
  force_penalty: 0.00035
  action_rate_penalty: 0.00004
  rail_penalty: 0.006
  angle_penalty: 0.001
  angular_velocity_penalty: 0.00004
  cart_velocity_penalty: 0.00008
  failure_penalty: 0.5

init:
  angle_noise: 0.02
  vel_noise: 0.004

validation:
  interval_updates: 2
  n_episodes: 2
  aggregate: p25
  reward_config:
    upright_weight: 1.0
    alive_bonus: 0.1
    force_penalty: 0.001
    rail_penalty: 0.01
  points:
    - [0.05, 0.05]
    - [0.15, 0.05]
    - [0.28, 0.05]
    - [0.50, 0.05]
    - [0.73, 0.05]
    - [1.19, 0.05]
    - [1.64, 0.05]
    - [2.10, 0.05]
    - [0.05, 0.48]
    - [0.28, 0.48]
    - [0.50, 0.48]
    - [0.73, 0.48]
    - [0.05, 1.76]
    - [0.28, 3.9]
    - [1.20, 2.0]
    - [2.10, 3.9]

ppo:
  hidden_dim: 128
  n_layers: 3
  n_heads: 4
  dropout: 0.1
  n_envs: 4
  rollout_steps: 1024
  n_epochs: 5
  mini_batch_size: 256
  gamma: 0.998
  gae_lambda: 0.98
  clip_epsilon: 0.05
  value_coef: 0.5
  entropy_coef: 0.00005
  init_log_std: -2.35
  freeze_log_std: true
  trainable_prefixes:
    - gain_net
    - param_residual_net
    - actor_trunk
    - mean_head
    - critic_trunk
    - value_head
  lr: 0.000012
  anneal_lr: false
  max_grad_norm: 0.20
  total_steps: 120000
  save_interval: 40000
  cgat:
    n_icga_layers: 2
    n_heads: 2
    entropy_coef: 0.00005
